<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation Editor</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
  padding:25px 15px;
}

.container{
  max-width:700px;
  margin:auto;
  background:#111;
  border:1px solid #d6ad45;
  border-radius:20px;
  padding:30px;
  box-shadow:0 0 35px rgba(214,173,69,.2);
}

h1{
  text-align:center;
  color:#e8c66a;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:30px;
}

label{
  display:block;
  margin:18px 0 7px;
  color:#e8c66a;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #555;
  background:#1b1b1b;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  margin-top:25px;
  padding:16px;
  border:0;
  border-radius:30px;
  background:#d6ad45;
  color:#111;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#f0d477;
}

.result{
  margin-top:25px;
  padding:20px;
  border:1px solid #444;
  border-radius:15px;
  display:none;
}

.link{
  word-break:break-all;
  color:#e8c66a;
  margin:15px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>💍 Wedding Invitation Editor</h1>

<p class="subtitle">
Create your beautiful wedding invitation
</p>

<label>🤵 Groom Name</label>
<input id="groom" placeholder="Enter Groom Name">

<label>👰 Bride Name</label>
<input id="bride" placeholder="Enter Bride Name">

<label>📅 Wedding Date</label>
<input id="date" placeholder="15 December 2026">

<label>⏰ Wedding Time</label>
<input id="time" placeholder="07:00 PM">

<label>📍 Wedding Venue</label>
<input id="venue" placeholder="Royal Wedding Palace, Kanpur">

<label>📱 WhatsApp Number</label>
<input id="phone" placeholder="919876543210">

<label>🖼️ Couple Photo URL</label>
<input id="photo" placeholder="https://example.com/photo.jpg">

<button onclick="generateInvitation()">
✨ Generate Wedding Invitation
</button>

<div class="result" id="result">

<h3>🎉 Your Invitation is Ready!</h3>

<p class="link" id="generatedLink"></p>

<button onclick="copyLink()">
📋 Copy Invitation Link
</button>

<button onclick="openInvitation()">
💍 Open Invitation
</button>

</div>

</div>

<script>

let finalLink="";

function generateInvitation(){

const groom=document.getElementById("groom").value.trim();
const bride=document.getElementById("bride").value.trim();
const date=document.getElementById("date").value.trim();
const time=document.getElementById("time").value.trim();
const venue=document.getElementById("venue").value.trim();
const phone=document.getElementById("phone").value.trim();
const photo=document.getElementById("photo").value.trim();

if(!groom || !bride || !date || !time || !venue){

alert("Please fill all required details.");

return;
}

const baseURL =
window.location.origin +
window.location.pathname.replace("admin.html","invitation.html");

const params=new URLSearchParams();

params.set("groom",groom);
params.set("bride",bride);
params.set("date",date);
params.set("time",time);
params.set("venue",venue);
params.set("phone",phone);
params.set("photo",photo);

finalLink=baseURL+"?"+params.toString();

document.getElementById("generatedLink").textContent=finalLink;

document.getElementById("result").style.display="block";

}

function copyLink(){

navigator.clipboard.writeText(finalLink);

alert("Invitation link copied!");

}

function openInvitation(){

window.open(finalLink,"_blank");

}

</script>

</body>
</html>
